<body>
  <a class="skip-link" href="#board">Skip to the board</a>

  <div class="app">
    <header class="topbar">
      <p class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        Sudoku
      </p>

      <div class="topbar__actions">
        <button id="soundToggle" class="icon-btn" type="button" aria-pressed="true" aria-label="Sound effects on" title="Sound effects">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="icon__body" d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" />
            <path class="icon__wave" d="M15.4 8.6a5 5 0 0 1 0 6.8M18 6a8.5 8.5 0 0 1 0 12" />
            <path class="icon__slash" d="M5 19 19 5" />
          </svg>
        </button>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch to light theme" title="Switch theme">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="icon__sun" d="M12 4.5v-2M12 21.5v-2M4.5 12h-2M21.5 12h-2M6.7 6.7 5.3 5.3M18.7 18.7l-1.4-1.4M6.7 17.3l-1.4 1.4M18.7 5.3l-1.4 1.4" />
            <circle class="icon__sun" cx="12" cy="12" r="3.6" />
            <path class="icon__moon" d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="game">
      <h1 class="sr-only">Play Sudoku online</h1>

      <p class="statusline" aria-live="polite">
        <span id="statDifficulty">Medium</span>
        <span class="sep" aria-hidden="true">/</span>
        <span id="statTimer" role="timer">00:00</span>
        <span class="sep" aria-hidden="true">/</span>
        <span id="statMistakes">0 of 3 mistakes</span>
        <span class="sep" aria-hidden="true">/</span>
        <span id="statHints">3 hints</span>
      </p>

      <div class="board" id="board" role="grid" aria-label="Sudoku board, 9 rows by 9 columns" tabindex="-1"></div>

      <div class="pad" id="pad" role="group" aria-label="Number pad"></div>

      <div class="toolbar" role="group" aria-label="Game actions">
        <button class="tool" id="btnUndo" type="button">Undo</button>
        <button class="tool" id="btnErase" type="button">Erase</button>
        <button class="tool" id="btnNotes" type="button" aria-pressed="false">Notes</button>
        <button class="tool" id="btnHint" type="button">Hint</button>
      </div>

      <nav class="levels" id="difficulties" aria-label="Choose a difficulty"></nav>
    </main>

    <footer class="footer">
      <p class="footer__keys">1–9 place &middot; &larr; &uarr; &rarr; &darr; move &middot; Backspace erase &middot; N notes &middot; H hint &middot; U undo</p>
      <p class="footer__links">
        <a href="about.html">How to play &amp; strategy</a>
        <span aria-hidden="true">&middot;</span>
        <a href="https://github.com/e0raj/sudoku" rel="noopener">Source code</a>
      </p>
    </footer>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 class="modal__title" id="modalTitle">Title</h2>
      <p class="modal__text" id="modalText">Text</p>
      <div class="modal__actions">
        <button class="btn btn--primary" id="modalPrimary" type="button">Play again</button>
        <button class="btn" id="modalSecondary" type="button">Close</button>
      </div>
    </div>
  </div>

  <noscript>
    <p class="noscript">This Sudoku game needs JavaScript to generate puzzles and respond to your moves. Please enable JavaScript in your browser to play.</p>
  </noscript>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
